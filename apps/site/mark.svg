<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <!-- The mark for the pages beside index.html (which draws it inline): the accent blue on white, the light blue on the navy footer. Each symbol holds its own gradient, because a page draws a symbol with a use element and Safari does not follow a gradient defined outside it (gantt#1886). -->
  <symbol id="mark" viewBox="0 0 32 32"><defs><linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="9" y2="0"><stop offset="0" stop-color="#1f5eff" stop-opacity="0"/><stop offset="1" stop-color="#1f5eff" stop-opacity="0.9"/></linearGradient></defs><g transform="translate(16 16) skewX(-14) translate(-16 -16)"><path d="M11 5h20v5.5H11z M31 10.5v5l-5-5z M17 10.5h5V29h-5z" fill="#1f5eff"/><path d="M0 5h9v2H0z M2 8.5h7v2H2z" fill="url(#streak)"/></g></symbol>
  <symbol id="mark-navy" viewBox="0 0 32 32"><defs><linearGradient id="streak-navy" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="9" y2="0"><stop offset="0" stop-color="#5aa9ff" stop-opacity="0"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0.9"/></linearGradient></defs><g transform="translate(16 16) skewX(-14) translate(-16 -16)"><path d="M11 5h20v5.5H11z M31 10.5v5l-5-5z M17 10.5h5V29h-5z" fill="#5aa9ff"/><path d="M0 5h9v2H0z M2 8.5h7v2H2z" fill="url(#streak-navy)"/></g></symbol>
</svg>
