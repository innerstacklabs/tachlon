<button data-part="open-button" type="button">Open…</button>

<button data-part="checks-button" type="button" aria-haspopup="dialog" aria-label="Checks" title="Checks"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4.5 3h6M4.5 6h6M4.5 9h6M1.5 3h.01M1.5 6h.01M1.5 9h.01"/></svg></button>
<input data-part="open-input" type="file" accept=".xer,.xml,.gantt" hidden>
<span data-part="open-info" aria-live="polite"><span data-part="open-file"></span></span>
<span data-part="unsaved-mark" title="Unsaved changes" role="img" aria-label="Unsaved changes" hidden></span>
<button data-part="import-notes" type="button" aria-expanded="false" aria-controls="unsupported" title="What the importer did not apply from this file" hidden></button>
