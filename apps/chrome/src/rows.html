<div class="tb-group" role="group" aria-label="Rows">
  <button data-part="insert-row" type="button" title="Insert a row below the selected row's subtree (Insert)">Insert</button>
  <button data-part="delete-row" type="button" title="Delete the selected row (Delete)">Delete</button>
</div>
<div class="tb-group" role="group" aria-label="Collapse to level">
  <span class="tb-label" title="Collapse to level">Level</span>
  <button data-part="level-1" type="button" data-level="1" title="Collapse every summary to level 1 (1)">1</button>
  <button data-part="level-2" type="button" data-level="2" title="Collapse every summary to level 2 (2)">2</button>
  <button data-part="level-all" type="button" title="Expand every summary (0)">All</button>
</div>
