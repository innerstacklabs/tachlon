<button data-part="baseline-set" type="button" aria-pressed="false" title="Keep the dates as they are now as the baseline">Baseline</button>
<button data-part="baseline-add" type="button" title="Give the tasks added since the baseline their current dates as baseline, and keep every other entry" hidden>Add new</button>
<button data-part="baseline-clear" type="button" title="Clear the baseline" hidden>Clear baseline</button>
