[package]
name = "timeline"
version = "0.1.0"
description = "Gantt timeline renderer: viewport state, time axis, wgpu bars and glyphon axis labels."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { path = "../engine" }
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.12"
wgpu = "30"

# In the browser: WebGPU when the page gets an adapter, WebGL2 otherwise.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }

[lints]
workspace = true
